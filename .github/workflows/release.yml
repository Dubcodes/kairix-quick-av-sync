name: Package Windows Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Kairix.QuickAVSync.sln
      - run: dotnet build Kairix.QuickAVSync.sln -c Release --no-restore -m:1 -nodeReuse:false
      - run: dotnet test tests/Kairix.QuickAVSync.Core.Tests/Kairix.QuickAVSync.Core.Tests.csproj -c Release --no-build -m:1 -nodeReuse:false
      - run: dotnet test tests/Kairix.QuickAVSync.Windows.Tests/Kairix.QuickAVSync.Windows.Tests.csproj -c Release --no-build -m:1 -nodeReuse:false
      - name: Define tagged release identity
        id: identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)$') { throw "Unsupported release tag: $tag" }
          $semanticVersion = $Matches[1]
          if ($semanticVersion -match '^\d+\.\d+\.\d+-beta(?:\.\d+)*$') {
            $buildChannel = 'Beta'
          } elseif ($semanticVersion -match '^\d+\.\d+\.\d+$') {
            $buildChannel = 'Release'
          } else {
            throw "Unsupported release channel for tag: $tag"
          }
          "semantic_version=$semanticVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build_channel=$buildChannel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Package tagged Windows release assets
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildId '${{ github.ref_name }}' -SourceCommit '${{ github.sha }}' -BuildChannel '${{ steps.identity.outputs.build_channel }}' -SemanticVersion '${{ steps.identity.outputs.semantic_version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Kairix-Quick-AV-Sync-${{ github.ref_name }}-win-x64
          path: artifacts/package/*
          if-no-files-found: error
      - name: Create release and upload verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $notes = Join-Path $PWD "docs/RELEASE_NOTES_$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Release notes were not found: $notes" }
          $packageDirectory = Join-Path $PWD 'artifacts/package'
          $expectedNames = @(
            "Kairix.QuickAVSync-$tag-win-x64.exe",
            "Kairix-Quick-AV-Sync-$tag-win-x64.zip",
            'Kairix-AV-Sync-Test-Signal.html',
            'SHA256SUMS.txt'
          )
          $actualNames = @(Get-ChildItem -LiteralPath $packageDirectory -File | ForEach-Object Name)
          if (@(Compare-Object $expectedNames $actualNames).Count -ne 0) { throw "Release asset names do not match the required set: $($actualNames -join ', ')" }

          $checksummedNames = $expectedNames[0..2]
          $checksumLines = @(Get-Content -LiteralPath (Join-Path $packageDirectory 'SHA256SUMS.txt'))
          if ($checksumLines.Count -ne 3) { throw 'SHA256SUMS.txt must contain exactly three entries.' }
          $verifiedNames = foreach ($line in $checksumLines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid checksum line: $line" }
            $name = $Matches[2]
            if ($checksummedNames -notcontains $name) { throw "Unexpected checksummed asset: $name" }
            $asset = Join-Path $packageDirectory $name
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Checksummed asset is missing: $name" }
            $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $name" }
            $name
          }
          if (@(Compare-Object $checksummedNames $verifiedNames).Count -ne 0) { throw 'SHA256SUMS.txt does not cover the exact three public assets.' }

          $assets = $expectedNames | ForEach-Object { Join-Path $packageDirectory $_ }
          $arguments = @($tag) + $assets + @("--repo", "${{ github.repository }}", "--title", "Kairix Quick A/V Sync $tag", "--notes-file", $notes, "--verify-tag")
          if ($tag -match '-') { $arguments += '--prerelease' }
          gh release create @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
