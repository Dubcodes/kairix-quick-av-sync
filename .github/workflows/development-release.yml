name: Publish Latest Development Build

on:
  workflow_run:
    workflows: ["Windows CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish-development-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Download the exact validated package set
        uses: actions/download-artifact@v4
        with:
          name: Kairix-Quick-AV-Sync-${{ github.event.workflow_run.head_sha }}-win-x64
          path: artifacts/package
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify package identity and checksums
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = Join-Path $PWD 'artifacts/package'
          $selfContained = @(Get-ChildItem -LiteralPath $packageDirectory -File | Where-Object Name -Match '^Kairix\.QuickAVSync-dev-\d{8}-[0-9a-f]{7}-win-x64\.exe$')
          if ($selfContained.Count -ne 1) { throw 'Expected exactly one identified self-contained executable.' }
          if ($selfContained[0].Name -notmatch '^Kairix\.QuickAVSync-(dev-\d{8}-[0-9a-f]{7})-win-x64\.exe$') { throw 'Could not read the development build ID.' }
          $buildId = $Matches[1]
          $expectedShortSha = '${{ github.event.workflow_run.head_sha }}'.Substring(0, 7)
          if (-not $buildId.EndsWith("-$expectedShortSha")) { throw "Package $buildId does not match validated commit $expectedShortSha." }

          $expectedNames = @(
            "Kairix.QuickAVSync-$buildId-win-x64.exe",
            "Kairix.QuickAVSync-$buildId-win-x64-framework-dependent.exe",
            "Kairix-Quick-AV-Sync-$buildId-win-x64.zip",
            'SHA256SUMS.txt'
          )
          foreach ($name in $expectedNames) {
            $path = Join-Path $packageDirectory $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "Expected package asset is missing or empty: $name"
            }
          }

          $checksumLines = @(Get-Content -LiteralPath (Join-Path $packageDirectory 'SHA256SUMS.txt'))
          if ($checksumLines.Count -ne 3) { throw 'SHA256SUMS.txt must contain exactly three public asset checksums.' }
          foreach ($line in $checksumLines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid checksum line: $line" }
            $asset = Join-Path $packageDirectory $Matches[2]
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Checksummed asset is missing: $($Matches[2])" }
            $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" }
          }
          "build_id=$buildId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Create the public development prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildId = '${{ steps.package.outputs.build_id }}'
          $sha = '${{ github.event.workflow_run.head_sha }}'
          gh release view $buildId --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Development release $buildId already exists; nothing to publish."
            exit 0
          }

          $notesPath = Join-Path $env:RUNNER_TEMP 'development-release-notes.md'
          @(
            '# Latest Development Build',
            '',
            "**Build:** ``$buildId``  ",
            "**Commit:** ``$sha``",
            '',
            'This build was produced from the current `main` commit after the required Windows validation passed.',
            '',
            'It is newer than the recommended release and may contain recently changed or unfinished functionality. Use the recommended release if stability is more important.',
            '',
            'The self-contained Windows x64 EXE is recommended for ordinary use. The smaller framework-dependent EXE requires the matching .NET Desktop Runtime.',
            '',
            'All development prereleases are retained to provide rollback history; at least the five newest successful builds remain public.'
          ) | Set-Content -LiteralPath $notesPath -Encoding utf8

          $assets = @(Get-ChildItem -LiteralPath (Join-Path $PWD 'artifacts/package') -File | ForEach-Object FullName)
          if ($assets.Count -ne 4) { throw 'Expected two EXEs, one ZIP, and SHA256SUMS.txt.' }
          gh release create $buildId @assets --repo '${{ github.repository }}' --target $sha --title "Latest Development Build · $buildId" --notes-file $notesPath --prerelease
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
