name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Kairix.QuickAVSync.sln
      - run: dotnet build Kairix.QuickAVSync.sln -c Release --no-restore
      - run: dotnet test tests/Kairix.QuickAVSync.Tests/Kairix.QuickAVSync.Tests.csproj -c Release --no-build
